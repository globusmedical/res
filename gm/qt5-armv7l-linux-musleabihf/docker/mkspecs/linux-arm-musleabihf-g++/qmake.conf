#
# qmake configuration for cross-compiling to ARM Linux musl hard-float
# using the armv7l-unknown-linux-musleabihf GCC 15.2.0 toolchain
#

MAKEFILE_GENERATOR      = UNIX
CONFIG                 += incremental
QMAKE_INCREMENTAL_STYLE = sublib

include(../common/linux.conf)
include(../common/gcc-base-unix.conf)
include(../common/g++-unix.conf)

QMAKE_CC                = armv7l-linux-musleabihf-gcc
QMAKE_CXX               = armv7l-linux-musleabihf-g++
QMAKE_LINK              = armv7l-linux-musleabihf-g++
QMAKE_LINK_SHLIB        = armv7l-linux-musleabihf-g++

QMAKE_AR                = armv7l-linux-musleabihf-ar cqs
QMAKE_OBJCOPY           = armv7l-linux-musleabihf-objcopy
QMAKE_NM                = armv7l-linux-musleabihf-nm -P
QMAKE_STRIP             = armv7l-linux-musleabihf-strip

# Match ct-ng config: cortex-a15, neon-vfpv4, hard float
QMAKE_CFLAGS           += -mcpu=cortex-a15 -mfpu=neon-vfpv4 -mfloat-abi=hard
QMAKE_CXXFLAGS         += -mcpu=cortex-a15 -mfpu=neon-vfpv4 -mfloat-abi=hard

load(qt_config)


[env]
GM_EXT_DIR = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/ext"
GM_MCTRL_ARCHIVE_DIR = "${GM_EXT_DIR}/archives"
GM_MCTRL_RES_DIR = "${GM_EXT_DIR}/res"
GM_MCTRL_TARGET_ARCH = "armv7-unknown-linux-musleabihf"

# Cargo features the PMAS tasks enable. Every crate in rs-gm_mctrl selects its
# motion-control backend with `elmo`, so that stays the default.
#
# A consuming crate that has no backend -- a benchmark, a standalone utility --
# overrides this to an empty string in its own `Makefile.toml` `[env]` block:
#
#     [env]
#     GM_MCTRL_PMAS_FEATURES = ""
#
# Before this was configurable such a crate had to declare a stub `elmo = []`
# feature purely to satisfy the task runner.
GM_MCTRL_PMAS_FEATURES = "elmo"

# The cross-toolchains are grab packages in the soup-archives registry. They
# used to be a 58 MB and a 98 MB curl from a raw GitHub LFS URL with no retry
# and no shared cache, which failed often enough to block work. grab retries,
# verifies, and caches content-addressed across every checkout on the machine,
# so the second consumer on a host pays nothing.
#
# One version covers both, because they are published together and only make
# sense as a matched pair.
PMAS_TOOLCHAIN_VERSION = "2026.09.19"
PMAS_TOOLCHAIN_REGISTRY = "soup-archives"

# The grab CLI is pinned so every consumer resolves the toolchain with the same
# fetcher, in the spirit of the other pins in this tree. Bumping it is a
# deliberate act. A grab already on PATH is used in preference, and GM_MCTRL_GRAB
# overrides both.
GRAB_VERSION = "1.0.4"
GRAB_REPO = "globusmedical/grab"

WIN_TOOLCHAIN_DIR = "armv7l-unknown-linux-musleabihf"
WIN_TOOLCHAIN_NAME = "armv7l-unknown-linux-musleabihf"
WIN_LINKER_NAME = "armv7l-unknown-linux-musleabihf-gcc"
WIN_AR_NAME = "armv7l-unknown-linux-musleabihf-ar"
WIN_TOOLCHAIN_PACKAGE = "pmas-toolchain-windows"
WIN_GRAB_ASSET = "grab-${GRAB_VERSION}-x86_64-pc-windows-msvc.zip"
WIN_GRAB_EXE = "grab.exe"

LINUX_TOOLCHAIN_DIR = "armv7l-linux-musleabihf-cross"
LINUX_TOOLCHAIN_NAME = "armv7l-linux-musleabihf-cross"
LINUX_LINKER_NAME = "armv7l-linux-musleabihf-gcc"
LINUX_AR_NAME = "armv7l-linux-musleabihf-ar"
LINUX_TOOLCHAIN_PACKAGE = "pmas-toolchain-linux"
LINUX_GRAB_ASSET = "grab-${GRAB_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
LINUX_GRAB_EXE = "grab"

[tasks.pmas_build]
dependencies = ["install_toolchain"]
command = "cargo"
args = [
    "build",
    "--target=${GM_MCTRL_TARGET_ARCH}",
    "--features=${GM_MCTRL_PMAS_FEATURES}",
    "--no-default-features",
    "${@}",
]

[tasks.pmas_test]
dependencies = ["install_toolchain"]
command = "cargo"
args = [
    "test",
    "--target=${GM_MCTRL_TARGET_ARCH}",
    "--features=${GM_MCTRL_PMAS_FEATURES}",
    "--no-default-features",
    "${@}",
]

[tasks.pmas_clippy]
dependencies = ["install_toolchain"]
command = "cargo"
args = [
    "clippy",
    "--target=${GM_MCTRL_TARGET_ARCH}",
    "--features=${GM_MCTRL_PMAS_FEATURES}",
    "--no-default-features",
    "${@}",
]

[tasks.pmas_clean]
dependencies = ["install_toolchain"]
command = "cargo"
args = ["clean", "--target=${GM_MCTRL_TARGET_ARCH}", "${@}"]

[tasks.pmas_doc]
dependencies = ["install_toolchain"]
command = "cargo"
args = [
    "doc",
    "--target=${GM_MCTRL_TARGET_ARCH}",
    "--features=${GM_MCTRL_PMAS_FEATURES}",
    "--no-default-features",
    "--no-deps",
    "${@}",
]

[tasks.pmas]
description = "Generic PMAS task runner - Usage: cargo make pmas <subcommand> [args]"
dependencies = ["install_toolchain"]
workspace = false
script_runner = "@duckscript"
script = '''
# require subcommand
if array_is_empty ${@}
    echo "Error: PMAS task requires at least one argument (cargo subcommand)"
    exit 1
end

# PMAS tasks are crate-scoped. Running from workspace root causes cargo to
# evaluate the wrong package context for --bin / --package filters.
working_dir = get_env CARGO_MAKE_WORKING_DIRECTORY
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
if equals "${working_dir}" "${workspace_dir}"
    echo "Error: PMAS tasks must be run from a specific crate directory, not workspace root."
    echo "Hint: cd to the crate's directory, then run: cargo make pmas <subcommand> [args]"
    echo "Example: cd <path/to/crate>; cargo make pmas build --release --bin <name>"
    exit 1
end

# first token = cargo subcommand, then keep the rest in ${@}
cargo_subcommand = array_get ${@} 0
array_remove ${@} 0

# default args to prepend if not already present
default_args_set = set_new "--target=${GM_MCTRL_TARGET_ARCH}" "--features=${GM_MCTRL_PMAS_FEATURES}" "--no-default-features"

# now iterate over remaining args, and remove those present in the default set from the default set
for a in ${@}
  if set_contains ${default_args_set} ${a}
    set_remove ${default_args_set} ${a}
  end
end

# assemble final args
final = array ${cargo_subcommand}

default_args = set_to_array ${default_args_set}
for a in ${default_args}
  array_push ${final} ${a}
end

for a in ${@}
  array_push ${final} ${a}
end

args_line = array_join ${final} " "
exec --fail-on-error cargo %{args_line}
'''

[tasks.install_toolchain]
dependencies = ["check_bootstrap", "fetch_toolchain", "activate_toolchain"]

# Drift check for the copied bootstrap. Lives here because this file is
# downloaded, so it costs the copies nothing.
#
# Unset is silent, not stale: either a pre-v2 bootstrap, which self-reports, or
# a crate whose makefile chain has no bootstrap. Warn, never fail.
[tasks.check_bootstrap]
private = true
script_runner = "@duckscript"
script = '''
expected = set "3"
found = set "${PMAS_BOOTSTRAP_VERSION}"
if not is_empty ${found}
    if not equals ${found} ${expected}
        echo "warning: the PMAS bootstrap in Makefile.toml is v${found}; res publishes v${expected}."
        echo "warning: re-copy makefile/pmas-bootstrap.ds from globusmedical/res into [config] load_script."
    end
end
'''

[tasks.fetch_toolchain.windows]
private = true
extend = "fetch_toolchain_common"
env.GM_MCTRL_TOOLCHAIN_DIR = "${GM_EXT_DIR}/toolchains/${WIN_TOOLCHAIN_DIR}"
env.GM_MCTRL_TOOLCHAIN_NAME = "${WIN_TOOLCHAIN_NAME}"
env.GM_MCTRL_TOOLCHAIN_PACKAGE = "${WIN_TOOLCHAIN_PACKAGE}"
env.GM_MCTRL_GRAB_ASSET = "${WIN_GRAB_ASSET}"
env.GM_MCTRL_GRAB_EXE = "${WIN_GRAB_EXE}"

[tasks.fetch_toolchain.linux]
private = true
extend = "fetch_toolchain_common"
env.GM_MCTRL_TOOLCHAIN_DIR = "${GM_EXT_DIR}/toolchains/${LINUX_TOOLCHAIN_DIR}"
env.GM_MCTRL_TOOLCHAIN_NAME = "${LINUX_TOOLCHAIN_NAME}"
env.GM_MCTRL_TOOLCHAIN_PACKAGE = "${LINUX_TOOLCHAIN_PACKAGE}"
env.GM_MCTRL_GRAB_ASSET = "${LINUX_GRAB_ASSET}"
env.GM_MCTRL_GRAB_EXE = "${LINUX_GRAB_EXE}"


# `CC_*`/`AR_*` are read by the `cc` crate, which builds the C sources of crates
# such as `mimalloc`. Without them `cc` falls back to scanning PATH for a fixed
# list of target prefixes; neither toolchain here uses one of those names, so on
# Linux it can reach the host compiler instead. Pinning them keeps any
# C-building dependency reproducible across hosts.
[tasks.activate_toolchain.windows]
private = true
env.GM_MCTRL_TOOLCHAIN_DIR = "${GM_EXT_DIR}/toolchains/${WIN_TOOLCHAIN_DIR}"
env.GM_MCTRL_LINKER_NAME = "${WIN_LINKER_NAME}"
env.GM_MCTRL_AR_NAME = "${WIN_AR_NAME}"
script = '''
#!@duckscript
path_old = get_env PATH
path_new = concat  "${GM_MCTRL_TOOLCHAIN_DIR}/bin;" ${path_old}
set_env PATH ${path_new}
set_env CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER ${GM_MCTRL_LINKER_NAME}
set_env CC_armv7_unknown_linux_musleabihf ${GM_MCTRL_LINKER_NAME}
set_env AR_armv7_unknown_linux_musleabihf ${GM_MCTRL_AR_NAME}
'''

[tasks.activate_toolchain.linux]
private = true
env.GM_MCTRL_TOOLCHAIN_DIR = "${GM_EXT_DIR}/toolchains/${LINUX_TOOLCHAIN_DIR}"
env.GM_MCTRL_LINKER_NAME = "${LINUX_LINKER_NAME}"
env.GM_MCTRL_AR_NAME = "${LINUX_AR_NAME}"
script = '''
#!@duckscript
path_old = get_env PATH
path_new = concat  "${GM_MCTRL_TOOLCHAIN_DIR}/bin:" ${path_old}
set_env PATH ${path_new}
set_env CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER ${GM_MCTRL_LINKER_NAME}
set_env CC_armv7_unknown_linux_musleabihf ${GM_MCTRL_LINKER_NAME}
set_env AR_armv7_unknown_linux_musleabihf ${GM_MCTRL_AR_NAME}
'''

[tasks.fetch_toolchain_common]
private = true
condition.files_not_exist = [
    "${GM_EXT_DIR}/toolchains/${GM_MCTRL_TOOLCHAIN_PACKAGE}-${PMAS_TOOLCHAIN_VERSION}.touch",
]
condition.fail_message = "(already downloaded)"
script = '''
#!@duckscript
# The sentinel names the package and version rather than a checksum: grab
# verifies content itself, and a version reads as something a person can
# compare against the registry.
touch_file = set "${GM_EXT_DIR}/toolchains/${GM_MCTRL_TOOLCHAIN_PACKAGE}-${PMAS_TOOLCHAIN_VERSION}.touch"
if is_path_exists ${touch_file}
    exit 0
end

toolchains_dir = set "${GM_EXT_DIR}/toolchains"
mkdir ${toolchains_dir}

# --- resolve a grab ----------------------------------------------------------
# GM_MCTRL_GRAB wins, then one already on PATH, then a pinned copy this task
# downloads into ext/tools. A consumer that already bootstraps grab for other
# reasons hands it over instead of paying for a second one.
grab_bin = get_env GM_MCTRL_GRAB
if is_empty ${grab_bin}
    probe = exec grab --version
    if equals "${probe.code}" 0
        grab_bin = set "grab"
    end
end
if is_empty ${grab_bin}
    grab_dir = set "${GM_EXT_DIR}/tools/grab-${GRAB_VERSION}"
    grab_bin = set "${grab_dir}/${GM_MCTRL_GRAB_EXE}"
    if not is_path_exists ${grab_bin}
        echo "Fetching grab ${GRAB_VERSION}..."
        mkdir ${grab_dir}
        # The grab CLI lives in a private repository, so this goes through the
        # GitHub CLI and the developer's existing login rather than a bare
        # curl. In CI, GH_TOKEN covers it.
        result = exec gh release download "grab-cli/v${GRAB_VERSION}" --repo ${GRAB_REPO} --pattern ${GM_MCTRL_GRAB_ASSET} --dir ${grab_dir} --clobber
        if not equals "${result.code}" 0
            echo "Failed to download ${GM_MCTRL_GRAB_ASSET} from ${GRAB_REPO}."
            echo "Install the GitHub CLI and run `gh auth login`, or put grab on PATH, or set GM_MCTRL_GRAB to one."
            echo "${result.stderr}"
            exit 1
        end
        # bsdtar reads both the .zip and the .tar.gz asset, and the binary sits
        # at the archive root.
        result = exec tar -xf "${grab_dir}/${GM_MCTRL_GRAB_ASSET}" -C ${grab_dir}
        if not equals "${result.code}" 0
            echo "Failed to unpack ${GM_MCTRL_GRAB_ASSET}"
            exit 1
        end
    end
end

# --- fetch the toolchain -----------------------------------------------------
# The manifest is generated rather than vendored. This file is downloaded into
# a consumer tree, so a second file the consumer had to copy by hand would
# defeat the point of the bootstrap.
manifest = set "${toolchains_dir}/grab.toml"
write_text_file ${manifest} "[project]\nname = \"pmas-toolchains\"\nedition = 1\n\n[defaults]\nregistry = \"${PMAS_TOOLCHAIN_REGISTRY}\"\ncollection = \"toolchains\"\n\n[registry.${PMAS_TOOLCHAIN_REGISTRY}]\nurl.base = \"s3://globus-${PMAS_TOOLCHAIN_REGISTRY}\"\n\n[registry.${PMAS_TOOLCHAIN_REGISTRY}.auth.fetch]\nfqid = \"grab:s3:${PMAS_TOOLCHAIN_REGISTRY}:fetch\"\n\n[collections.toolchains.members]\n${GM_MCTRL_TOOLCHAIN_PACKAGE} = { version = \"${PMAS_TOOLCHAIN_VERSION}\", deploy = \".\" }\n"

echo "Installing toolchain in ${GM_MCTRL_TOOLCHAIN_DIR}..."
result = exec ${grab_bin} --manifest-path ${manifest} fetch
if not equals "${result.code}" 0
    echo "grab fetch failed for ${GM_MCTRL_TOOLCHAIN_PACKAGE}@${PMAS_TOOLCHAIN_VERSION}."
    echo "${result.stdout}"
    echo "${result.stderr}"
    exit 1
end

# grab reports success even when it resolved nothing, so check the compiler is
# actually where the activate step will look for it.
if not is_path_exists "${GM_MCTRL_TOOLCHAIN_DIR}/bin"
    echo "grab reported success but ${GM_MCTRL_TOOLCHAIN_DIR}/bin is missing."
    exit 1
end

write_text_file ${touch_file} "${GM_MCTRL_TOOLCHAIN_PACKAGE}@${PMAS_TOOLCHAIN_VERSION} installed in ${GM_MCTRL_TOOLCHAIN_DIR}"
'''

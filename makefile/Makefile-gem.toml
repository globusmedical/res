# Makefile-gem.toml — self-contained GEM backend build tasks
#
# This repository (globusmedical/res) is the canonical source of these build
# tasks. Application repositories vendor a git-tracked copy pulled from here
# deliberately (see e.g. rs-gm_mctrl/makefile/) — not auto-synced. Docker is
# the only external build dependency.

[env]
GEM_VOLUME_PREFIX = { value = "gem", condition = { env_not_set = ["GEM_VOLUME_PREFIX"] } }

[tasks.gem]
description = "GEM task runner — Usage: cargo make gem <subcommand> [args]"
workspace = false
script_runner = "@duckscript"
script = '''
show_help = set false
if array_is_empty ${@}
    show_help = set true
else
    first = array_get ${@} 0
    if equals ${first} "help"
        show_help = set true
    elseif equals ${first} "--help"
        show_help = set true
    elseif equals ${first} "-h"
        show_help = set true
    end
end

if ${show_help}
    echo ""
    echo "Usage: cargo make gem <subcommand> [args]"
    echo ""
    echo "GEM target tasks (Docker-backed):"
    echo "  build [cargo-args]         cargo build for GEM target defaults"
    echo "  test [cargo-args]          cargo test for GEM target defaults"
    echo "  clippy [cargo-args]        cargo clippy for GEM target defaults"
    echo "  doc [cargo-args]           cargo doc for GEM target defaults"
    echo "  build-mock [cargo-args]    cargo build with gem,gem-mock defaults"
    echo "  test-mock [cargo-args]     cargo test with gem,gem-mock defaults"
    echo ""
    echo "Packaging tasks:"
    echo "  package-mctrl <crate-dir> [flags]   Build a .gem motion-control package"
    echo "  kmod <rt-crate-dir> [flags]         Build a kernel module (off-target finalizer)"
    echo "  gemctl <args>                       Run host gemctl (no remote SSH shell)"
    echo ""
    echo "Kernel modules are built by completing the GEM OS module kit with your"
    echo "RT crate. This needs only a Rust toolchain — no Docker, no kernel"
    echo "headers, no Linux — and produces the module that actually ships."
    echo "'docker-kmod' rebuilds the same source with the kernel toolchain as a"
    echo "validation oracle; its output is never shipped."
    echo ""
    echo "Kit resolution (cargo make gem kmod):"
    echo "  1) GEM_KIT_DIR                  an already-extracted kit directory"
    echo "  2) GEM_OS_VERSION               one exact release, e.g. 0.35.0"
    echo "  3) the compatible range implied by your gm_mctrl_gem version,"
    echo "     read from makefile/gem-builder-compat.toml (default)"
    echo "  The kit is fetched with grab from the soup-archives registry, which"
    echo "  resolves the newest release in range and verifies what it caches."
    echo "  Set GEM_KIT_REFRESH=1 to re-resolve instead of reusing the local copy."
    echo ""
    echo "Developer/internal compatibility aliases (not required for normal usage):"
    echo "  docker-package, docker-package-mctrl, docker-kmod, docker-shell, docker-pull"
    echo ""
    echo "Image selection:"
    echo "  The builder image is resolved from Cargo package versions using"
    echo "  makefile/gem-builder-compat.toml. Set GEM_BUILDER_IMAGE explicitly"
    echo "  only when intentionally overriding compatibility resolution."
    echo ""
    echo "Environment variable overrides:"
    echo "  GEM_BUILDER_IMAGE      Override the resolved builder image tag (advanced)."
    echo "  GEM_DOCKER_SIBLINGS    Mount extra host directories into the builder container."
    echo "                         Format: host_path:container_path"
    echo "                         Multiple mounts: host1:cont1@host2:cont2"
    echo ""
    exit 0
end

subcmd = array_get ${@} 0
array_remove ${@} 0
if not array_is_empty ${@}
    first_arg = array_get ${@} 0
    if equals ${first_arg} "--"
        array_remove ${@} 0
    end
end

is_cargo_gem = set false
if equals ${subcmd} "build"
    is_cargo_gem = set true
elseif equals ${subcmd} "test"
    is_cargo_gem = set true
elseif equals ${subcmd} "clippy"
    is_cargo_gem = set true
elseif equals ${subcmd} "doc"
    is_cargo_gem = set true
elseif equals ${subcmd} "build-mock"
    is_cargo_gem = set true
elseif equals ${subcmd} "test-mock"
    is_cargo_gem = set true
end

if ${is_cargo_gem}
    has_no_default = set false
    extract_artifacts = set false

    for a in ${@}
        if equals ${a} "--no-default-features"
            has_no_default = set true
        end
    end

    final = array ${subcmd}
    if equals ${subcmd} "build-mock"
        array_set final 0 "build"
        array_push ${final} "--features=gem,gem-mock"
        extract_artifacts = set true
    elseif equals ${subcmd} "test-mock"
        array_set final 0 "test"
        array_push ${final} "--features=gem,gem-mock"
    else
        array_push ${final} "--features=gem"
        if equals ${subcmd} "build"
            extract_artifacts = set true
        end
    end

    if not ${has_no_default}
        array_push ${final} "--no-default-features"
    end

    for a in ${@}
        array_push ${final} ${a}
    end

    args_line = array_join ${final} " "
    set_env GEM_DOCKER_INNER_CMD "cargo ${args_line}"
    if ${extract_artifacts}
        set_env GEM_DOCKER_EXTRACT_ARTIFACTS "1"
    else
        set_env GEM_DOCKER_EXTRACT_ARTIFACTS ""
    end
    cm_run_task gem_private_docker_cargo
    exit 0
end

is_package = set false
if equals ${subcmd} "package-mctrl"
    is_package = set true
elseif equals ${subcmd} "docker-package"
    is_package = set true
elseif equals ${subcmd} "docker-package-mctrl"
    is_package = set true
end

if ${is_package}
    if array_is_empty ${@}
        workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
        working_dir = get_env CARGO_MAKE_WORKING_DIRECTORY
        if equals "${working_dir}" "${workspace_dir}"
            echo "Usage: cargo make gem package-mctrl -- <crate-dir> [flags]"
            echo "       Or run from a package crate directory: cargo make gem package-mctrl"
            exit 1
        end
        crate_dir = replace "${working_dir}" "${workspace_dir}/" ""
        crate_dir = replace "${crate_dir}" "${workspace_dir}\\" ""
        crate_dir = replace "${crate_dir}" "\\" "/"
    else
        crate_dir = array_get ${@} 0
        array_remove ${@} 0
    end
    set_env GEM_CRATE_DIR ${crate_dir}
    extra = array_join ${@} " "
    set_env GEM_DOCKER_EXTRA_ARGS ${extra}
    cm_run_task gem_private_docker_package
    exit 0
end

if equals ${subcmd} "kmod"
    if array_is_empty ${@}
        workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
        working_dir = get_env CARGO_MAKE_WORKING_DIRECTORY
        if equals "${working_dir}" "${workspace_dir}"
            echo "Usage: cargo make gem kmod -- <rt-crate-dir> [gem-kmod flags]"
            echo "       Or run from an RT crate directory: cargo make gem kmod"
            exit 1
        end
        rt_crate = replace "${working_dir}" "${workspace_dir}/" ""
        rt_crate = replace "${rt_crate}" "${workspace_dir}\\" ""
        rt_crate = replace "${rt_crate}" "\\" "/"
    else
        rt_crate = array_get ${@} 0
        array_remove ${@} 0
    end
    set_env GEM_RT_CRATE ${rt_crate}
    extra = array_join ${@} " "
    set_env GEM_DOCKER_EXTRA_ARGS ${extra}
    cm_run_task gem_private_finalize
    exit 0
end

if equals ${subcmd} "docker-kmod"
    if array_is_empty ${@}
        workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
        working_dir = get_env CARGO_MAKE_WORKING_DIRECTORY
        if equals "${working_dir}" "${workspace_dir}"
            echo "Usage: cargo make gem docker-kmod -- <rt-crate-dir> [gem-kmod flags]"
            echo "       Or run from an RT crate directory: cargo make gem docker-kmod"
            exit 1
        end
        rt_crate = replace "${working_dir}" "${workspace_dir}/" ""
        rt_crate = replace "${rt_crate}" "${workspace_dir}\\" ""
        rt_crate = replace "${rt_crate}" "\\" "/"
    else
        rt_crate = array_get ${@} 0
        array_remove ${@} 0
    end
    set_env GEM_RT_CRATE ${rt_crate}
    extra = array_join ${@} " "
    set_env GEM_DOCKER_EXTRA_ARGS ${extra}
    cm_run_task gem_private_docker_kmod
    exit 0
end

if equals ${subcmd} "docker-shell"
    cm_run_task gem_private_docker_shell
    exit 0
end

if equals ${subcmd} "docker-pull"
    cm_run_task gem_private_docker_pull
    exit 0
end

if equals ${subcmd} "gemctl"
    if array_is_empty ${@}
        echo "Usage: cargo make gem gemctl -- <gemctl-args>"
        echo "Examples:"
        echo "  cargo make gem gemctl -- --server http://192.168.1.10:50051 health"
        echo "  cargo make gem gemctl -- mctrl status"
        echo "Server resolution:"
        echo "  1) explicit --server in args"
        echo "  2) GEM_SERVER env"
        echo "  3) GEM_POC_HOST env -> http://<host>:50051"
        exit 1
    end

    args_line = array_join ${@} " "
    server = get_env GEM_SERVER

    if is_empty ${server}
        poc_host = get_env GEM_POC_HOST
        if not is_empty ${poc_host}
            server_host = set ${poc_host}
            if contains "${server_host}" "@"
                host_parts = split "${server_host}" "@"
                for p in ${host_parts}
                    server_host = set ${p}
                end
                release ${host_parts}
            end
            server = set "http://${server_host}:50051"
        end
    end

    os = os_family
    if is_empty ${server}
        cmdline = set "cargo run --manifest-path ../gm-ethercat-master/Cargo.toml --bin gemctl -- ${args_line}"
    else
        cmdline = set "cargo run --manifest-path ../gm-ethercat-master/Cargo.toml --bin gemctl -- --server ${server} ${args_line}"
    end

    if equals ${os} "windows"
        exec --fail-on-error cmd /C ${cmdline}
    else
        exec --fail-on-error sh -c "${cmdline}"
    end
    exit 0
end

echo "ERROR: unsupported gem subcommand '${subcmd}'."
echo "Run 'cargo make gem help' for supported commands."
exit 1
'''

[tasks.gem_private_finalize]
private = true
description = "Complete the GEM OS module kit with an RT crate, off-target"
dependencies = ["gem_private_ensure_artifacts"]
script_runner = "node"
script_extension = "mjs"
script = '''
import { spawnSync } from "child_process";
import {
    existsSync, mkdirSync, readFileSync, rmSync, writeFileSync,
} from "fs";
import { isAbsolute, join, relative, resolve, sep } from "path";

const GEM_OS_REPO = "globusmedical/gm-ethercat-master";

// Registry the GEM OS release pipeline publishes the module kit to.
const KIT_PACKAGE = "gem-module-kit";
const KIT_REGISTRY = "soup-archives";
const KIT_REGISTRY_URL = "s3://globus-soup-archives";

const workspaceDir =
    process.env.CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY ?? process.cwd();

// The Docker packaging path reuses this script purely to resolve (and cache)
// the kit on the host; it finalizes later, inside the container.
const resolveOnly = process.env.GEM_KIT_RESOLVE_ONLY === "1";

const rtCrate = process.env.GEM_RT_CRATE;
if (!resolveOnly && !rtCrate) {
    console.error("ERROR: GEM_RT_CRATE is empty.");
    process.exit(1);
}

function run(cmd, args, opts = {}) {
    const child = spawnSync(cmd, args, { stdio: "inherit", ...opts });
    return child.status ?? 1;
}

function capture(cmd, args, opts = {}) {
    const child = spawnSync(cmd, args, { encoding: "utf8", ...opts });
    return child.status === 0 ? child.stdout.trim() : null;
}

// ---------------------------------------------------------------------------
// 1. The finalizer binary.
//
// A sibling gm-ethercat-master checkout is preferred so a developer working on
// both repositories finalizes with the tooling they are editing, rather than a
// stale installed copy. Which one won decides what toolchain builds the
// shipped module, so it is always reported rather than left ambient.
// ---------------------------------------------------------------------------
function resolveGemKmod() {
    const sibling = resolve(workspaceDir, "..", "gm-ethercat-master", "tools", "rs", "gem_kmod");
    if (existsSync(join(sibling, "Cargo.toml"))) {
        return { kind: "path", location: sibling };
    }
    const version = capture("gem-kmod", ["--version"]);
    if (version !== null) {
        return { kind: "installed", version };
    }
    return { kind: "missing" };
}

const kmod = resolveGemKmod();
if (!resolveOnly && kmod.kind === "missing") {
    console.error("ERROR: gem-kmod is not available.");
    console.error("");
    console.error("Install it from the GEM OS release you target:");
    console.error(`  cargo install --locked --git https://github.com/${GEM_OS_REPO} \\`);
    console.error("      --tag gem/v<version> gem_kmod --features cli");
    console.error("");
    console.error("Or check out gm-ethercat-master next to this repository.");
    process.exit(1);
}
if (!resolveOnly) {
    console.log(
        kmod.kind === "path"
            ? `Finalizer: sibling checkout ${kmod.location}`
            : `Finalizer: installed ${kmod.version}`,
    );
}

// ---------------------------------------------------------------------------
// 2. The module kit.
//
// The kit's __versions table and vermagic are fixed by the kernel of the GEM OS
// release it was cut from, so the kit version and the target GEM OS version
// must agree. Mismatches are rejected by the finalizer, not silently accepted.
// ---------------------------------------------------------------------------
// The schema version this finalizer understands. Kept in sync with
// `KIT_FORMAT` in tools/rs/gem_kmod/src/kit.rs.
const EXPECTED_KIT_FORMAT = 2;

// Which GEM OS releases this build may use is a property of the source tree,
// not of whoever happens to build it today — but it is not a number anyone
// should maintain by hand either. Choosing a gm_mctrl GEM backend already
// chooses a compatible range of GEM OS releases, so derive the range from the
// backend version Cargo resolved and let the registry pick the newest release
// inside it.
function resolveBackendVersion() {
    const pkgid = capture("cargo", ["pkgid", "-p", "gm_mctrl_gem"], { cwd: workspaceDir });
    if (!pkgid) {
        console.error("ERROR: cannot resolve gm_mctrl_gem from Cargo metadata.");
        console.error("Add a GEM-enabled gm_mctrl dependency, then run cargo update.");
        process.exit(1);
    }
    // `cargo pkgid` prints e.g. `registry+https://...#gm_mctrl_gem@0.22.0`
    // or `path+file:///...#0.22.0`.
    const tail = pkgid.split("#").pop();
    const version = tail.includes("@") ? tail.split("@").pop() : tail;
    const parts = version.split(".");
    if (parts.length < 2) {
        console.error(`ERROR: cannot parse gm_mctrl_gem version from: ${pkgid}`);
        process.exit(1);
    }
    return { version, key: `${parts[0]}.${parts[1]}` };
}

// Reads the same compatibility table that resolves the builder image, so the
// backend version has exactly one place that says what it is compatible with.
function lookupCompatibleGemOs(key) {
    const path = join(workspaceDir, "makefile", "gem-builder-compat.toml");
    let table;
    try {
        table = readFileSync(path, "utf8");
    } catch (e) {
        console.error(`ERROR: cannot read ${path} (${e.message}).`);
        process.exit(1);
    }

    let inMatch = false;
    for (const line of table.split("\n")) {
        const clean = line.trim().replace(/\s*=\s*/g, "=");
        if (clean.startsWith("[[builder]]")) {
            inMatch = false;
        } else if (clean === `gm_mctrl_gem="${key}"`) {
            inMatch = true;
        } else if (inMatch && clean.startsWith("gem_os=")) {
            return clean.slice("gem_os=".length).replace(/"/g, "");
        }
    }
    return null;
}

function resolveGemOsRequirement() {
    const requested = process.env.GEM_OS_VERSION?.trim();
    if (requested) {
        const exact = requested.startsWith("v") ? requested.slice(1) : requested;
        return { req: `=${exact}`, source: "GEM_OS_VERSION" };
    }

    const backend = resolveBackendVersion();
    const req = lookupCompatibleGemOs(backend.key);
    if (!req) {
        console.error("ERROR: no compatible GEM OS range found.");
        console.error(`       gm_mctrl_gem resolved to ${backend.version};`
            + ` compatibility key ${backend.key}.`);
        console.error("       Add a matching [[builder]] entry with a `gem_os`"
            + " constraint to makefile/gem-builder-compat.toml,");
        console.error("       or set GEM_OS_VERSION to an exact release.");
        process.exit(1);
    }
    return { req, source: `gm_mctrl_gem ${backend.version}` };
}

// Fail loudly when a kit does not match what was requested, instead of
// silently finalizing against the wrong GEM OS release. Returns a reason
// string rather than exiting, so callers can decide whether a bad kit is a
// fatal user error or merely a cache to discard. `expectedVersion` may be null
// when the release was chosen by range rather than named up front.
function checkKit(dir, expectedVersion) {
    let manifest;
    try {
        manifest = JSON.parse(readFileSync(join(dir, "kit.json"), "utf8"));
    } catch (e) {
        return `kit.json is unreadable (${e.message})`;
    }
    if (manifest.kit_format !== EXPECTED_KIT_FORMAT) {
        return `kit_format is ${manifest.kit_format}, expected ${EXPECTED_KIT_FORMAT}`
            + " — update gem-kmod (or the kit) so both sides agree on the manifest schema";
    }
    const normalize = (v) => (v.startsWith("v") ? v : `v${v}`);
    if (expectedVersion && normalize(manifest.gem_os_version) !== normalize(expectedVersion)) {
        return `kit is for GEM OS ${manifest.gem_os_version}, expected ${expectedVersion}`;
    }
    for (const name of ["kit.ko", manifest.linker_script]) {
        if (!existsSync(join(dir, name))) {
            return `kit is missing ${name}`;
        }
    }
    return null;
}

function verifyKitOrExit(dir, expectedVersion) {
    const reason = checkKit(dir, expectedVersion);
    if (reason) {
        console.error(`ERROR: kit at ${dir}: ${reason}.`);
        process.exit(1);
    }
}

function kitVersion(dir) {
    try {
        return JSON.parse(readFileSync(join(dir, "kit.json"), "utf8")).gem_os_version;
    } catch {
        return "unknown";
    }
}

function requireGrab() {
    if (capture("grab", ["--version"]) !== null) {
        return;
    }
    console.error("ERROR: the grab CLI is not installed.");
    console.error("");
    console.error("Windows:");
    console.error("  irm https://raw.githubusercontent.com/globusmedical/grab/main/scripts/install.ps1 | iex");
    console.error("Linux/macOS:");
    console.error("  cargo install --git https://github.com/globusmedical/grab.git grab-cli");
    console.error("");
    console.error("Or point GEM_KIT_DIR at an already-extracted kit.");
    process.exit(1);
}

function resolveKit() {
    if (process.env.GEM_KIT_DIR) {
        const dir = resolve(process.env.GEM_KIT_DIR);
        if (!existsSync(join(dir, "kit.json"))) {
            console.error(`ERROR: GEM_KIT_DIR=${dir} does not contain kit.json.`);
            process.exit(1);
        }
        return dir;
    }

    const { req, source } = resolveGemOsRequirement();
    const root = join(workspaceDir, "target", "gem-kit");
    // grab resolves `deploy` relative to the manifest, so both live here.
    const manifestPath = join(root, "grab.toml");
    const kitDir = join(root, "kit");
    const stampPath = join(root, "requirement.txt");
    const reportPath = join(root, "fetch-report.json");

    const stamp = existsSync(stampPath) ? readFileSync(stampPath, "utf8").trim() : null;
    const refresh = process.env.GEM_KIT_REFRESH === "1";
    // A build should not need the network, and should not silently swap the
    // kernel ABI underneath a developer mid-session. Re-resolve only when the
    // requirement itself moved, or when explicitly asked to.
    if (!refresh && stamp === req && existsSync(kitDir)) {
        const reason = checkKit(kitDir, null);
        if (!reason) {
            console.log(`Module kit: GEM OS ${kitVersion(kitDir)} (cached; ${source} needs ${req}).`);
            return kitDir;
        }
        // A truncated deployment must not pin the build to a broken kit
        // forever: discard and fetch again.
        console.warn(`Discarding unusable cached kit at ${kitDir}: ${reason}.`);
    }
    rmSync(kitDir, { recursive: true, force: true });
    rmSync(stampPath, { force: true });

    requireGrab();
    mkdirSync(root, { recursive: true });

    // The manifest is generated rather than committed: the version requirement
    // it carries is derived from the backend version, and a second committed
    // copy could only ever drift from it.
    writeFileSync(manifestPath, [
        "# Generated by `cargo make gem kmod` — edits are overwritten.",
        "",
        "[project]",
        'name = "gem-module-kit-fetch"',
        "edition = 1",
        "",
        "[defaults]",
        `registry = "${KIT_REGISTRY}"`,
        'collection = "kit"',
        "",
        `[registry.${KIT_REGISTRY}]`,
        `url.base = "${KIT_REGISTRY_URL}"`,
        "",
        `[registry.${KIT_REGISTRY}.auth.fetch]`,
        `fqid = "grab:s3:${KIT_REGISTRY}:fetch"`,
        "",
        "# Copied, not linked: the kit is handed to a container that only sees",
        "# this working tree.",
        "[collections.kit.members]",
        `${KIT_PACKAGE} = { version = "${req}", deploy = "kit", force_copy = true }`,
        "",
    ].join("\n"));

    console.log(`Fetching module kit ${KIT_PACKAGE} ${req} (${source})...`);
    const fetched = run("grab", [
        "--manifest-path", manifestPath,
        `--json=${reportPath}`,
        "fetch", "--fail-fast",
    ]) === 0;

    let report = null;
    try {
        report = JSON.parse(readFileSync(reportPath, "utf8"));
    } catch {
        // No report is itself a failure signal; handled below.
    }

    if (!fetched) {
        console.error("ERROR: failed to fetch the module kit.");
        // grab's own diagnosis is more specific than anything we can infer.
        for (const failure of report?.failures ?? []) {
            console.error(`  ${failure.error}`);
        }
        console.error("");
        console.error(`Check that you can reach the ${KIT_REGISTRY} registry`);
        console.error("(`grab login`), or point GEM_KIT_DIR at an extracted kit");
        console.error(`downloaded from a ${GEM_OS_REPO} release.`);
        process.exit(1);
    }

    // The kit's own manifest is the authority; the report only says what the
    // registry thought it was serving.
    verifyKitOrExit(kitDir, report?.packages?.[0]?.version ?? null);

    console.log(`Module kit: GEM OS ${kitVersion(kitDir)}.`);
    writeFileSync(stampPath, req);
    return kitDir;
}

const kitDir = resolveKit();

// The container sees the workspace at /workspace and nothing else, so a kit
// outside the workspace cannot be handed to it.
if (resolveOnly) {
    const rel = relative(workspaceDir, kitDir);
    if (!rel || rel.startsWith("..") || isAbsolute(rel)) {
        console.error(`ERROR: the module kit at ${kitDir} lies outside the workspace,`);
        console.error("so the builder container cannot see it.");
        console.error("Copy it under target/gem-kit/ and point GEM_KIT_DIR at that copy.");
        process.exit(1);
    }
    const stateDir = join(workspaceDir, "target", "cargo-make");
    mkdirSync(stateDir, { recursive: true });
    writeFileSync(join(stateDir, "gem-kit-dir.txt"), rel.split(sep).join("/"));
    process.exit(0);
}

// ---------------------------------------------------------------------------
// 3. Finalize.
// ---------------------------------------------------------------------------
const extra = (process.env.GEM_DOCKER_EXTRA_ARGS ?? "").split(" ").filter(Boolean);
const finalizeArgs = ["finalize", "--rt-crate", rtCrate, "--kit", kitDir, ...extra];

const status =
    kmod.kind === "path"
        ? run("cargo", [
              "run", "--quiet", "--manifest-path", join(kmod.location, "Cargo.toml"),
              "--features", "cli", "--", ...finalizeArgs,
          ])
        : run("gem-kmod", finalizeArgs);

process.exit(status);
'''

[tasks.gem_private_resolve_kit_dir]
private = true
description = "Resolve the module kit on the host, for the Docker packaging path"
env = { "GEM_KIT_RESOLVE_ONLY" = "1" }
run_task = "gem_private_finalize"

[tasks.gem_private_docker_cargo]
private = true
dependencies = ["gem_private_docker_check", "gem_private_resolve_builder", "gem_private_prepare_docker_env"]
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
image = readfile "${workspace_dir}/target/cargo-make/gem-builder-image.txt"
image = trim ${image}
env_file = readfile "${workspace_dir}/target/cargo-make/gem-env-file.txt"
env_file = trim ${env_file}
inner_cmd = get_env GEM_DOCKER_INNER_CMD
if is_empty ${inner_cmd}
    echo "ERROR: GEM_DOCKER_INNER_CMD is empty."
    exit 1
end

set_env GEM_DOCKER_IMAGE ${image}
set_env GEM_DOCKER_ENV_FILE ${env_file}
set_env GEM_DOCKER_INNER_CMD ${inner_cmd}
cm_run_task gem_private_run_docker
'''

[tasks.gem_private_ensure_artifacts]
# `gem-builder-compat.toml` and `gem-docker-run.sh` are the git-tracked,
# canonical copies of these files — this task only guards against an
# accidentally deleted local copy. It intentionally does NOT fetch anything:
# this repository is where these files live, not a cache of them.
private = true
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
makefile_dir = set "${workspace_dir}/makefile"

compat_file = set "${makefile_dir}/gem-builder-compat.toml"
helper_file = set "${makefile_dir}/gem-docker-run.sh"

if not is_path_exists ${compat_file}
    echo "ERROR: ${compat_file} is missing. It is a tracked file, not a download cache; restore it from git (git checkout -- makefile/gem-builder-compat.toml)."
    exit 1
end

if not is_path_exists ${helper_file}
    echo "ERROR: ${helper_file} is missing. It is a tracked file, not a download cache; restore it from git (git checkout -- makefile/gem-docker-run.sh)."
    exit 1
end
'''

[tasks.gem_private_resolve_builder]
private = true
dependencies = ["gem_private_ensure_artifacts"]
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
out_dir = set "${workspace_dir}/target/cargo-make"
mkdir ${out_dir}
out_file = set "${out_dir}/gem-builder-image.txt"

override_image = get_env GEM_BUILDER_IMAGE
if not is_empty ${override_image}
    image = trim ${override_image}
    writefile ${out_file} ${image}
    echo "GEM builder image override: ${image}"
    exit 0
end

pkg = exec cargo pkgid -p gm_mctrl_gem
if not equals ${pkg.code} 0
    echo "ERROR: cannot resolve gm_mctrl_gem from Cargo metadata."
    echo "       Add a GEM-enabled gm_mctrl dependency, then run cargo update if needed."
    exit 1
end

pkgid = trim ${pkg.stdout}
version_part = set ""
pkg_parts = split ${pkgid} "#"
for part in ${pkg_parts}
    version_part = set ${part}
end
release ${pkg_parts}

version_text = set "${version_part}"
if contains "${version_part}" "@"
    at_parts = split "${version_part}" "@"
    for part in ${at_parts}
        version_text = set ${part}
    end
    release ${at_parts}
end

if is_empty ${version_text}
    echo "ERROR: cannot parse gm_mctrl_gem version from: ${pkgid}"
    exit 1
end

version_segments = split "${version_text}" "."
major = set ""
minor = set ""
segment_index = set 0
for segment in ${version_segments}
    if equals "${segment_index}" "0"
        major = set ${segment}
    elseif equals "${segment_index}" "1"
        minor = set ${segment}
    end
    segment_index = calc ${segment_index} + 1
end
release ${version_segments}
if is_empty ${major}
    echo "ERROR: cannot parse gm_mctrl_gem semantic version: ${version_text}"
    exit 1
end
if is_empty ${minor}
    echo "ERROR: cannot parse gm_mctrl_gem semantic version: ${version_text}"
    exit 1
end
version_key = set "${major}.${minor}"

compat_file = set "${workspace_dir}/makefile/gem-builder-compat.toml"
compat = readfile ${compat_file}
lines = split "${compat}" "\n"
needle = set "gm_mctrl_gem=\"${version_key}\""
in_match = set false
image = set ""

for line in ${lines}
    clean = trim "${line}"
    clean = replace "${clean}" " = " "="
    clean = replace "${clean}" "= " "="
    clean = replace "${clean}" " =" "="
    if starts_with "${clean}" "[[builder]]"
        in_match = set false
    elseif equals "${clean}" "${needle}"
        in_match = set true
    elseif ${in_match}
        if starts_with "${clean}" "image=\""
            tmp = replace "${clean}" "image=\"" ""
            image = replace "${tmp}" "\"" ""
        end
    end
end
release ${lines}

if is_empty ${image}
    echo "ERROR: no compatible GEM builder image found."
    echo "       gm_mctrl_gem resolved to ${version_text}; compatibility key ${version_key}."
    echo "       Update makefile/gem-builder-compat.toml or set GEM_BUILDER_IMAGE explicitly."
    exit 1
end

writefile ${out_file} ${image}
echo "GEM builder image: ${image} (gm_mctrl_gem ${version_text})"
'''

[tasks.gem_private_docker_check]
private = true
script_runner = "@duckscript"
script = '''
os = os_family
if equals ${os} "windows"
    native = exec cmd /C docker info
    if equals ${native.code} 0
        exit 0
    end
    wsl_docker = exec cmd /C wsl docker info
    if equals ${wsl_docker.code} 0
        exit 0
    end
else
    native = exec sh -c "docker info"
    if equals ${native.code} 0
        exit 0
    end
end

echo "ERROR: Docker is not available."
echo "       Start Docker Desktop or a WSL2 Docker daemon and retry."
exit 1
'''

[tasks.gem_private_prepare_docker_env]
private = true
script_runner = "@duckscript"
script = '''
github_token = get_env GITHUB_TOKEN
if is_empty ${github_token}
    exit_on_error false
    gh_out = exec gh auth token
    exit_on_error true
    if equals ${gh_out.code} 0
        github_token = trim ${gh_out.stdout}
    end
end

workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
ts = current_time
env_dir = set "${workspace_dir}/target/cargo-make"
mkdir ${env_dir}
env_file = set "${env_dir}/gem-env-${ts}"
if is_empty ${github_token}
    writefile ${env_file} ""
else
    writefile ${env_file} "GITHUB_TOKEN=${github_token}"
end
state_file = set "${env_dir}/gem-env-file.txt"
writefile ${state_file} ${env_file}
'''

[tasks.gem_private_docker_package]
private = true
dependencies = ["gem_private_docker_check", "gem_private_resolve_builder", "gem_private_resolve_kit_dir", "gem_private_prepare_docker_env"]
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
crate_dir = get_env GEM_CRATE_DIR
if is_empty ${crate_dir}
    echo "Usage: cargo make gem package-mctrl -- <crate-dir> [flags]"
    exit 1
end

image = readfile "${workspace_dir}/target/cargo-make/gem-builder-image.txt"
image = trim ${image}
env_file = readfile "${workspace_dir}/target/cargo-make/gem-env-file.txt"
env_file = trim ${env_file}
extra = get_env GEM_DOCKER_EXTRA_ARGS

# Split-RT packaging finalizes against a module kit (ADR-0008) and has no
# Kbuild fallback. The kit was resolved on the host into the workspace, which
# the container sees at /workspace.
kit_rel = readfile "${workspace_dir}/target/cargo-make/gem-kit-dir.txt"
kit_rel = trim ${kit_rel}

inner_cmd = set "export GEM_KIT_DIR=/workspace/${kit_rel}; gem-package ${crate_dir} ${extra}; if [ -f /workspace/makefile/verify-split-rt-package.sh ]; then bash /workspace/makefile/verify-split-rt-package.sh ${crate_dir}; fi"
set_env GEM_DOCKER_IMAGE ${image}
set_env GEM_DOCKER_ENV_FILE ${env_file}
set_env GEM_DOCKER_INNER_CMD ${inner_cmd}
cm_run_task gem_private_run_docker
'''

[tasks.gem_private_docker_kmod]
private = true
dependencies = ["gem_private_docker_check", "gem_private_resolve_builder", "gem_private_prepare_docker_env"]
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
rt_crate = get_env GEM_RT_CRATE
if is_empty ${rt_crate}
    echo "Usage: cargo make gem docker-kmod -- <rt-crate-dir> [gem-kmod flags]"
    exit 1
end

image = readfile "${workspace_dir}/target/cargo-make/gem-builder-image.txt"
image = trim ${image}
env_file = readfile "${workspace_dir}/target/cargo-make/gem-env-file.txt"
env_file = trim ${env_file}
extra = get_env GEM_DOCKER_EXTRA_ARGS

inner_cmd = set "gem-kmod build --rt-crate ${rt_crate} ${extra}"
set_env GEM_DOCKER_IMAGE ${image}
set_env GEM_DOCKER_ENV_FILE ${env_file}
set_env GEM_DOCKER_INNER_CMD ${inner_cmd}
cm_run_task gem_private_run_docker
'''

[tasks.gem_private_docker_shell]
private = true
dependencies = ["gem_private_docker_check", "gem_private_resolve_builder", "gem_private_prepare_docker_env"]
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
image = readfile "${workspace_dir}/target/cargo-make/gem-builder-image.txt"
image = trim ${image}
env_file = readfile "${workspace_dir}/target/cargo-make/gem-env-file.txt"
env_file = trim ${env_file}

set_env GEM_DOCKER_IMAGE ${image}
set_env GEM_DOCKER_ENV_FILE ${env_file}
set_env GEM_DOCKER_INNER_CMD "exec bash"
set_env GEM_DOCKER_INTERACTIVE "1"
cm_run_task gem_private_run_docker
'''

[tasks.gem_private_docker_pull]
private = true
dependencies = ["gem_private_docker_check", "gem_private_resolve_builder", "gem_private_prepare_docker_env"]
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
image = readfile "${workspace_dir}/target/cargo-make/gem-builder-image.txt"
image = trim ${image}
env_file = readfile "${workspace_dir}/target/cargo-make/gem-env-file.txt"
env_file = trim ${env_file}

set_env GEM_DOCKER_IMAGE ${image}
set_env GEM_DOCKER_ENV_FILE ${env_file}
set_env GEM_DOCKER_INNER_CMD "true"
set_env GEM_DOCKER_PULL_ONLY "1"
cm_run_task gem_private_run_docker
'''

[tasks.gem_private_run_docker]
private = true
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
workspace_fwd = replace ${workspace_dir} "\\" "/"
helper = set "${workspace_fwd}/makefile/gem-docker-run.sh"

image = get_env GEM_DOCKER_IMAGE
env_file = get_env GEM_DOCKER_ENV_FILE
inner_cmd = get_env GEM_DOCKER_INNER_CMD
extract_artifacts = get_env GEM_DOCKER_EXTRACT_ARTIFACTS
pull_only = get_env GEM_DOCKER_PULL_ONLY
image = trim ${image}
env_file = trim ${env_file}
inner_cmd = trim ${inner_cmd}
extract_artifacts = trim ${extract_artifacts}
vol_prefix = get_env GEM_VOLUME_PREFIX
interactive = get_env GEM_DOCKER_INTERACTIVE
if not is_empty ${pull_only}
    set_env GEM_DOCKER_PULL_ONLY ${pull_only}
end
if is_empty ${extract_artifacts}
    extract_artifacts = set "0"
end

parent_dir = dirname ${workspace_fwd}
sibling_mounts = set ""
cargo_toml = readfile "${workspace_fwd}/Cargo.toml"
lines = split ${cargo_toml} "\n"
sibling_names_seen = set ""
for line in ${lines}
    if contains ${line} "path = \"../"
        idx_start = indexof ${line} "\"../"
        if not is_empty ${idx_start}
            idx_start = calc ${idx_start} + 4
            remainder = substring ${line} ${idx_start}
            idx_end = indexof ${remainder} "/"
            if not is_empty ${idx_end}
                repo_name = substring ${remainder} 0 ${idx_end}
                already = contains ${sibling_names_seen} "|${repo_name}|"
                if not ${already}
                    sibling_names_seen = set "${sibling_names_seen}|${repo_name}|"
                end
            end
        end
    end
end
release ${lines}

os = os_family
use_wsl = set false
docker_workspace = set ${workspace_fwd}
docker_env_file = set ${env_file}
docker_helper = set ${helper}
if equals ${os} "windows"
    use_wsl = set true
    wsl_ws = exec wsl wslpath -u ${workspace_fwd}
    docker_workspace = trim ${wsl_ws.stdout}
    env_fwd = replace ${env_file} "\\" "/"
    wsl_env = exec wsl wslpath -u ${env_fwd}
    docker_env_file = trim ${wsl_env.stdout}
    wsl_helper = exec wsl wslpath -u ${helper}
    docker_helper = trim ${wsl_helper.stdout}
end

if not is_empty ${sibling_names_seen}
    parts = split ${sibling_names_seen} "|"
    for name in ${parts}
        if not is_empty ${name}
            sib_dir = set "${parent_dir}/${name}"
            if not is_directory ${sib_dir}
                echo "ERROR: Cargo path dependency sibling is missing: ${sib_dir}"
                echo "       Restore the sibling checkout or remove its path dependency before running a GEM task."
                exit 1
            end
            if ${use_wsl}
                sib_wsl = exec wsl wslpath -u ${sib_dir}
                if not equals ${sib_wsl.code} 0
                    echo "ERROR: cannot convert sibling path for WSL Docker: ${sib_dir}"
                    exit 1
                end
                sib_docker = trim ${sib_wsl.stdout}
            else
                sib_docker = set ${sib_dir}
            end
            mount = set "${sib_docker}:/${name}"
            if is_empty ${sibling_mounts}
                sibling_mounts = set ${mount}
            else
                sibling_mounts = set "${sibling_mounts}@${mount}"
            end
        end
    end
    release ${parts}
end

# Explicit override/addition for sibling mounts.
# Format: <host_path>:<container_path>@<host_path>:<container_path>
manual_sibling_mounts = get_env GEM_DOCKER_SIBLINGS
manual_sibling_mounts = trim ${manual_sibling_mounts}
if not is_empty ${manual_sibling_mounts}
    if is_empty ${sibling_mounts}
        sibling_mounts = set ${manual_sibling_mounts}
    else
        sibling_mounts = set "${sibling_mounts}@${manual_sibling_mounts}"
    end
end

sibling_mounts_arg = set "${sibling_mounts}"
if is_empty ${sibling_mounts_arg}
    sibling_mounts_arg = set "-"
end

if equals ${interactive} "1"
    if ${use_wsl}
        exec --fail-on-error wsl bash ${docker_helper} --interactive ${docker_workspace} ${docker_env_file} ${vol_prefix} ${image} ${sibling_mounts_arg} ${extract_artifacts} ${inner_cmd}
    else
        exec --fail-on-error bash ${docker_helper} --interactive ${docker_workspace} ${env_file} ${vol_prefix} ${image} ${sibling_mounts_arg} ${extract_artifacts} ${inner_cmd}
    end
else
    if ${use_wsl}
        exec --fail-on-error wsl bash ${docker_helper} ${docker_workspace} ${docker_env_file} ${vol_prefix} ${image} ${sibling_mounts_arg} ${extract_artifacts} ${inner_cmd}
    else
        exec --fail-on-error bash ${docker_helper} ${docker_workspace} ${env_file} ${vol_prefix} ${image} ${sibling_mounts_arg} ${extract_artifacts} ${inner_cmd}
    end
end
'''

# Makefile-gem.toml — self-contained GEM backend build tasks
#
# Distributed from globusmedical/res and cached in application repositories by
# their cargo-make bootstrap harness. The application repository is the only
# checkout required; Docker is the only external build dependency.

[env]
GEM_RES_BASE_URL = { value = "https://github.com/globusmedical/res/raw/refs/heads/main/makefile", condition = { env_not_set = ["GEM_RES_BASE_URL"] } }
GEM_VOLUME_PREFIX = { value = "gem", condition = { env_not_set = ["GEM_VOLUME_PREFIX"] } }

[tasks.gem]
description = "GEM task runner — Usage: cargo make gem <subcommand> [args]"
workspace = false
script_runner = "@duckscript"
script = '''
show_help = set false
if array_is_empty ${@}
    show_help = set true
else
    first = array_get ${@} 0
    if equals ${first} "help"
        show_help = set true
    elseif equals ${first} "--help"
        show_help = set true
    elseif equals ${first} "-h"
        show_help = set true
    end
end

if ${show_help}
    echo ""
    echo "Usage: cargo make gem <subcommand> [args]"
    echo ""
    echo "GEM target tasks (Docker-backed):"
    echo "  build [cargo-args]         cargo build for GEM target defaults"
    echo "  test [cargo-args]          cargo test for GEM target defaults"
    echo "  clippy [cargo-args]        cargo clippy for GEM target defaults"
    echo "  doc [cargo-args]           cargo doc for GEM target defaults"
    echo "  build-mock [cargo-args]    cargo build with gem,gem-mock defaults"
    echo "  test-mock [cargo-args]     cargo test with gem,gem-mock defaults"
    echo ""
    echo "Packaging tasks:"
    echo "  package-mctrl <crate-dir> [flags]   Build a .gem motion-control package"
    echo "  kmod <rt-crate-dir> [flags]         Build a kernel module only"
    echo "  gemctl <args>                       Run host gemctl (no remote SSH shell)"
    echo ""
    echo "Developer/internal compatibility aliases (not required for normal usage):"
    echo "  docker-package, docker-package-mctrl, docker-kmod, docker-shell, docker-pull"
    echo ""
    echo "Image selection:"
    echo "  The builder image is resolved from Cargo package versions using"
    echo "  makefile/gem-builder-compat.toml. Set GEM_BUILDER_IMAGE explicitly"
    echo "  only when intentionally overriding compatibility resolution."
    echo ""
    exit 0
end

subcmd = array_get ${@} 0
array_remove ${@} 0
if not array_is_empty ${@}
    first_arg = array_get ${@} 0
    if equals ${first_arg} "--"
        array_remove ${@} 0
    end
end

is_cargo_gem = set false
if equals ${subcmd} "build"
    is_cargo_gem = set true
elseif equals ${subcmd} "test"
    is_cargo_gem = set true
elseif equals ${subcmd} "clippy"
    is_cargo_gem = set true
elseif equals ${subcmd} "doc"
    is_cargo_gem = set true
elseif equals ${subcmd} "build-mock"
    is_cargo_gem = set true
elseif equals ${subcmd} "test-mock"
    is_cargo_gem = set true
end

if ${is_cargo_gem}
    has_no_default = set false
    extract_artifacts = set false

    for a in ${@}
        if equals ${a} "--no-default-features"
            has_no_default = set true
        end
    end

    final = array ${subcmd}
    if equals ${subcmd} "build-mock"
        array_set final 0 "build"
        array_push ${final} "--features=gem,gem-mock"
        extract_artifacts = set true
    elseif equals ${subcmd} "test-mock"
        array_set final 0 "test"
        array_push ${final} "--features=gem,gem-mock"
    else
        array_push ${final} "--features=gem"
        if equals ${subcmd} "build"
            extract_artifacts = set true
        end
    end

    if not ${has_no_default}
        array_push ${final} "--no-default-features"
    end

    for a in ${@}
        array_push ${final} ${a}
    end

    args_line = array_join ${final} " "
    set_env GEM_DOCKER_INNER_CMD "cargo ${args_line}"
    if ${extract_artifacts}
        set_env GEM_DOCKER_EXTRACT_ARTIFACTS "1"
    else
        set_env GEM_DOCKER_EXTRACT_ARTIFACTS ""
    end
    cm_run_task gem_private_docker_cargo
    exit 0
end

is_package = set false
if equals ${subcmd} "package-mctrl"
    is_package = set true
elseif equals ${subcmd} "docker-package"
    is_package = set true
elseif equals ${subcmd} "docker-package-mctrl"
    is_package = set true
end

if ${is_package}
    if array_is_empty ${@}
        workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
        working_dir = get_env CARGO_MAKE_WORKING_DIRECTORY
        if equals "${working_dir}" "${workspace_dir}"
            echo "Usage: cargo make gem package-mctrl -- <crate-dir> [flags]"
            echo "       Or run from a package crate directory: cargo make gem package-mctrl"
            exit 1
        end
        crate_dir = replace "${working_dir}" "${workspace_dir}/" ""
        crate_dir = replace "${crate_dir}" "${workspace_dir}\\" ""
        crate_dir = replace "${crate_dir}" "\\" "/"
    else
        crate_dir = array_get ${@} 0
        array_remove ${@} 0
    end
    set_env GEM_CRATE_DIR ${crate_dir}
    extra = array_join ${@} " "
    set_env GEM_DOCKER_EXTRA_ARGS ${extra}
    cm_run_task gem_private_docker_package
    exit 0
end

if equals ${subcmd} "kmod"
    if array_is_empty ${@}
        workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
        working_dir = get_env CARGO_MAKE_WORKING_DIRECTORY
        if equals "${working_dir}" "${workspace_dir}"
            echo "Usage: cargo make gem kmod -- <rt-crate-dir> [gem-kmod flags]"
            echo "       Or run from an RT crate directory: cargo make gem kmod"
            exit 1
        end
        rt_crate = replace "${working_dir}" "${workspace_dir}/" ""
        rt_crate = replace "${rt_crate}" "${workspace_dir}\\" ""
        rt_crate = replace "${rt_crate}" "\\" "/"
    else
        rt_crate = array_get ${@} 0
        array_remove ${@} 0
    end
    set_env GEM_RT_CRATE ${rt_crate}
    extra = array_join ${@} " "
    set_env GEM_DOCKER_EXTRA_ARGS ${extra}
    cm_run_task gem_private_docker_kmod
    exit 0
end

if equals ${subcmd} "docker-kmod"
    if array_is_empty ${@}
        workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
        working_dir = get_env CARGO_MAKE_WORKING_DIRECTORY
        if equals "${working_dir}" "${workspace_dir}"
            echo "Usage: cargo make gem docker-kmod -- <rt-crate-dir> [gem-kmod flags]"
            echo "       Or run from an RT crate directory: cargo make gem docker-kmod"
            exit 1
        end
        rt_crate = replace "${working_dir}" "${workspace_dir}/" ""
        rt_crate = replace "${rt_crate}" "${workspace_dir}\\" ""
        rt_crate = replace "${rt_crate}" "\\" "/"
    else
        rt_crate = array_get ${@} 0
        array_remove ${@} 0
    end
    set_env GEM_RT_CRATE ${rt_crate}
    extra = array_join ${@} " "
    set_env GEM_DOCKER_EXTRA_ARGS ${extra}
    cm_run_task gem_private_docker_kmod
    exit 0
end

if equals ${subcmd} "docker-shell"
    cm_run_task gem_private_docker_shell
    exit 0
end

if equals ${subcmd} "docker-pull"
    cm_run_task gem_private_docker_pull
    exit 0
end

if equals ${subcmd} "gemctl"
    if array_is_empty ${@}
        echo "Usage: cargo make gem gemctl -- <gemctl-args>"
        echo "Examples:"
        echo "  cargo make gem gemctl -- --server http://192.168.1.10:50051 health"
        echo "  cargo make gem gemctl -- mctrl status"
        echo "Server resolution:"
        echo "  1) explicit --server in args"
        echo "  2) GEM_SERVER env"
        echo "  3) GEM_POC_HOST env -> http://<host>:50051"
        exit 1
    end

    args_line = array_join ${@} " "
    server = get_env GEM_SERVER

    if is_empty ${server}
        poc_host = get_env GEM_POC_HOST
        if not is_empty ${poc_host}
            server_host = set ${poc_host}
            if contains "${server_host}" "@"
                host_parts = split "${server_host}" "@"
                for p in ${host_parts}
                    server_host = set ${p}
                end
                release ${host_parts}
            end
            server = set "http://${server_host}:50051"
        end
    end

    os = os_family
    if is_empty ${server}
        cmdline = set "cargo run --manifest-path ../gm-ethercat-master/Cargo.toml --bin gemctl -- ${args_line}"
    else
        cmdline = set "cargo run --manifest-path ../gm-ethercat-master/Cargo.toml --bin gemctl -- --server ${server} ${args_line}"
    end

    if equals ${os} "windows"
        exec --fail-on-error cmd /C ${cmdline}
    else
        exec --fail-on-error sh -c "${cmdline}"
    end
    exit 0
end

echo "ERROR: unsupported gem subcommand '${subcmd}'."
echo "Run 'cargo make gem help' for supported commands."
exit 1
'''

[tasks.gem_private_docker_cargo]
private = true
dependencies = ["gem_private_docker_check", "gem_private_resolve_builder", "gem_private_prepare_docker_env"]
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
image = readfile "${workspace_dir}/target/cargo-make/gem-builder-image.txt"
image = trim ${image}
env_file = readfile "${workspace_dir}/target/cargo-make/gem-env-file.txt"
env_file = trim ${env_file}
inner_cmd = get_env GEM_DOCKER_INNER_CMD
if is_empty ${inner_cmd}
    echo "ERROR: GEM_DOCKER_INNER_CMD is empty."
    exit 1
end

set_env GEM_DOCKER_IMAGE ${image}
set_env GEM_DOCKER_ENV_FILE ${env_file}
set_env GEM_DOCKER_INNER_CMD ${inner_cmd}
cm_run_task gem_private_run_docker
'''

[tasks.gem_private_ensure_artifacts]
private = true
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
makefile_dir = set "${workspace_dir}/makefile"
mkdir ${makefile_dir}

compat_file = set "${makefile_dir}/gem-builder-compat.toml"
helper_file = set "${makefile_dir}/gem-docker-run.sh"

if not is_path_exists ${compat_file}
    url = set "${GEM_RES_BASE_URL}/gem-builder-compat.toml"
    result = exec curl -L --fail -o ${compat_file} ${url}
    if not equals ${result.code} 0
        echo "ERROR: failed to download ${url}"
        exit 1
    end
end

if not is_path_exists ${helper_file}
    url = set "${GEM_RES_BASE_URL}/gem-docker-run.sh"
    result = exec curl -L --fail -o ${helper_file} ${url}
    if not equals ${result.code} 0
        echo "ERROR: failed to download ${url}"
        exit 1
    end
end
'''

[tasks.gem_private_resolve_builder]
private = true
dependencies = ["gem_private_ensure_artifacts"]
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
out_dir = set "${workspace_dir}/target/cargo-make"
mkdir ${out_dir}
out_file = set "${out_dir}/gem-builder-image.txt"

override_image = get_env GEM_BUILDER_IMAGE
if not is_empty ${override_image}
    image = trim ${override_image}
    writefile ${out_file} ${image}
    echo "GEM builder image override: ${image}"
    exit 0
end

pkg = exec cargo pkgid -p gm_mctrl_gem
if not equals ${pkg.code} 0
    echo "ERROR: cannot resolve gm_mctrl_gem from Cargo metadata."
    echo "       Add a GEM-enabled gm_mctrl dependency, then run cargo update if needed."
    exit 1
end

pkgid = trim ${pkg.stdout}
version_part = set ""
pkg_parts = split ${pkgid} "#"
for part in ${pkg_parts}
    version_part = set ${part}
end
release ${pkg_parts}

version_text = set "${version_part}"
if contains "${version_part}" "@"
    at_parts = split "${version_part}" "@"
    for part in ${at_parts}
        version_text = set ${part}
    end
    release ${at_parts}
end

if is_empty ${version_text}
    echo "ERROR: cannot parse gm_mctrl_gem version from: ${pkgid}"
    exit 1
end

version_segments = split "${version_text}" "."
major = set ""
minor = set ""
segment_index = set 0
for segment in ${version_segments}
    if equals "${segment_index}" "0"
        major = set ${segment}
    elseif equals "${segment_index}" "1"
        minor = set ${segment}
    end
    segment_index = calc ${segment_index} + 1
end
release ${version_segments}
if is_empty ${major}
    echo "ERROR: cannot parse gm_mctrl_gem semantic version: ${version_text}"
    exit 1
end
if is_empty ${minor}
    echo "ERROR: cannot parse gm_mctrl_gem semantic version: ${version_text}"
    exit 1
end
version_key = set "${major}.${minor}"

compat_file = set "${workspace_dir}/makefile/gem-builder-compat.toml"
compat = readfile ${compat_file}
lines = split "${compat}" "\n"
needle = set "gm_mctrl_gem=\"${version_key}\""
in_match = set false
image = set ""

for line in ${lines}
    clean = trim "${line}"
    clean = replace "${clean}" " = " "="
    clean = replace "${clean}" "= " "="
    clean = replace "${clean}" " =" "="
    if starts_with "${clean}" "[[builder]]"
        in_match = set false
    elseif equals "${clean}" "${needle}"
        in_match = set true
    elseif ${in_match}
        if starts_with "${clean}" "image=\""
            tmp = replace "${clean}" "image=\"" ""
            image = replace "${tmp}" "\"" ""
        end
    end
end
release ${lines}

if is_empty ${image}
    echo "ERROR: no compatible GEM builder image found."
    echo "       gm_mctrl_gem resolved to ${version_text}; compatibility key ${version_key}."
    echo "       Update makefile/gem-builder-compat.toml or set GEM_BUILDER_IMAGE explicitly."
    exit 1
end

writefile ${out_file} ${image}
echo "GEM builder image: ${image} (gm_mctrl_gem ${version_text})"
'''

[tasks.gem_private_docker_check]
private = true
script_runner = "@duckscript"
script = '''
os = os_family
if equals ${os} "windows"
    native = exec cmd /C docker info
    if equals ${native.code} 0
        exit 0
    end
    wsl_docker = exec cmd /C wsl docker info
    if equals ${wsl_docker.code} 0
        exit 0
    end
else
    native = exec sh -c "docker info"
    if equals ${native.code} 0
        exit 0
    end
end

echo "ERROR: Docker is not available."
echo "       Start Docker Desktop or a WSL2 Docker daemon and retry."
exit 1
'''

[tasks.gem_private_prepare_docker_env]
private = true
script_runner = "@duckscript"
script = '''
github_token = get_env GITHUB_TOKEN
if is_empty ${github_token}
    exit_on_error false
    gh_out = exec gh auth token
    exit_on_error true
    if equals ${gh_out.code} 0
        github_token = trim ${gh_out.stdout}
    end
end

workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
ts = current_time
env_dir = set "${workspace_dir}/target/cargo-make"
mkdir ${env_dir}
env_file = set "${env_dir}/gem-env-${ts}"
if is_empty ${github_token}
    writefile ${env_file} ""
else
    writefile ${env_file} "GITHUB_TOKEN=${github_token}"
end
state_file = set "${env_dir}/gem-env-file.txt"
writefile ${state_file} ${env_file}
'''

[tasks.gem_private_docker_package]
private = true
dependencies = ["gem_private_docker_check", "gem_private_resolve_builder", "gem_private_prepare_docker_env"]
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
crate_dir = get_env GEM_CRATE_DIR
if is_empty ${crate_dir}
    echo "Usage: cargo make gem package-mctrl -- <crate-dir> [flags]"
    exit 1
end

image = readfile "${workspace_dir}/target/cargo-make/gem-builder-image.txt"
image = trim ${image}
env_file = readfile "${workspace_dir}/target/cargo-make/gem-env-file.txt"
env_file = trim ${env_file}
extra = get_env GEM_DOCKER_EXTRA_ARGS

inner_cmd = set "gem-package ${crate_dir} ${extra}; if [ -f /workspace/makefile/verify-split-rt-package.sh ]; then bash /workspace/makefile/verify-split-rt-package.sh ${crate_dir}; fi"
set_env GEM_DOCKER_IMAGE ${image}
set_env GEM_DOCKER_ENV_FILE ${env_file}
set_env GEM_DOCKER_INNER_CMD ${inner_cmd}
cm_run_task gem_private_run_docker
'''

[tasks.gem_private_docker_kmod]
private = true
dependencies = ["gem_private_docker_check", "gem_private_resolve_builder", "gem_private_prepare_docker_env"]
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
rt_crate = get_env GEM_RT_CRATE
if is_empty ${rt_crate}
    echo "Usage: cargo make gem docker-kmod -- <rt-crate-dir> [gem-kmod flags]"
    exit 1
end

image = readfile "${workspace_dir}/target/cargo-make/gem-builder-image.txt"
image = trim ${image}
env_file = readfile "${workspace_dir}/target/cargo-make/gem-env-file.txt"
env_file = trim ${env_file}
extra = get_env GEM_DOCKER_EXTRA_ARGS

inner_cmd = set "gem-kmod build --rt-crate ${rt_crate} ${extra}"
set_env GEM_DOCKER_IMAGE ${image}
set_env GEM_DOCKER_ENV_FILE ${env_file}
set_env GEM_DOCKER_INNER_CMD ${inner_cmd}
cm_run_task gem_private_run_docker
'''

[tasks.gem_private_docker_shell]
private = true
dependencies = ["gem_private_docker_check", "gem_private_resolve_builder", "gem_private_prepare_docker_env"]
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
image = readfile "${workspace_dir}/target/cargo-make/gem-builder-image.txt"
image = trim ${image}
env_file = readfile "${workspace_dir}/target/cargo-make/gem-env-file.txt"
env_file = trim ${env_file}

set_env GEM_DOCKER_IMAGE ${image}
set_env GEM_DOCKER_ENV_FILE ${env_file}
set_env GEM_DOCKER_INNER_CMD "exec bash"
set_env GEM_DOCKER_INTERACTIVE "1"
cm_run_task gem_private_run_docker
'''

[tasks.gem_private_docker_pull]
private = true
dependencies = ["gem_private_docker_check", "gem_private_resolve_builder", "gem_private_prepare_docker_env"]
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
image = readfile "${workspace_dir}/target/cargo-make/gem-builder-image.txt"
image = trim ${image}
env_file = readfile "${workspace_dir}/target/cargo-make/gem-env-file.txt"
env_file = trim ${env_file}

set_env GEM_DOCKER_IMAGE ${image}
set_env GEM_DOCKER_ENV_FILE ${env_file}
set_env GEM_DOCKER_INNER_CMD "true"
set_env GEM_DOCKER_PULL_ONLY "1"
cm_run_task gem_private_run_docker
'''

[tasks.gem_private_run_docker]
private = true
script_runner = "@duckscript"
script = '''
workspace_dir = get_env CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY
workspace_fwd = replace ${workspace_dir} "\\" "/"
helper = set "${workspace_fwd}/makefile/gem-docker-run.sh"

image = get_env GEM_DOCKER_IMAGE
env_file = get_env GEM_DOCKER_ENV_FILE
inner_cmd = get_env GEM_DOCKER_INNER_CMD
extract_artifacts = get_env GEM_DOCKER_EXTRACT_ARTIFACTS
pull_only = get_env GEM_DOCKER_PULL_ONLY
image = trim ${image}
env_file = trim ${env_file}
inner_cmd = trim ${inner_cmd}
extract_artifacts = trim ${extract_artifacts}
vol_prefix = get_env GEM_VOLUME_PREFIX
interactive = get_env GEM_DOCKER_INTERACTIVE
if not is_empty ${pull_only}
    set_env GEM_DOCKER_PULL_ONLY ${pull_only}
end
if is_empty ${extract_artifacts}
    extract_artifacts = set "0"
end

parent_dir = dirname ${workspace_fwd}
sibling_mounts = set ""
cargo_toml = readfile "${workspace_fwd}/Cargo.toml"
lines = split ${cargo_toml} "\n"
sibling_names_seen = set ""
for line in ${lines}
    if contains ${line} "path = \"../"
        idx_start = indexof ${line} "\"../"
        if not is_empty ${idx_start}
            idx_start = calc ${idx_start} + 4
            remainder = substring ${line} ${idx_start}
            idx_end = indexof ${remainder} "/"
            if not is_empty ${idx_end}
                repo_name = substring ${remainder} 0 ${idx_end}
                already = contains ${sibling_names_seen} "|${repo_name}|"
                if not ${already}
                    sibling_names_seen = set "${sibling_names_seen}|${repo_name}|"
                end
            end
        end
    end
end
release ${lines}

os = os_family
use_wsl = set false
docker_workspace = set ${workspace_fwd}
docker_env_file = set ${env_file}
docker_helper = set ${helper}
if equals ${os} "windows"
    use_wsl = set true
    wsl_ws = exec wsl wslpath -u ${workspace_fwd}
    docker_workspace = trim ${wsl_ws.stdout}
    env_fwd = replace ${env_file} "\\" "/"
    wsl_env = exec wsl wslpath -u ${env_fwd}
    docker_env_file = trim ${wsl_env.stdout}
    wsl_helper = exec wsl wslpath -u ${helper}
    docker_helper = trim ${wsl_helper.stdout}
end

if not is_empty ${sibling_names_seen}
    parts = split ${sibling_names_seen} "|"
    for name in ${parts}
        if not is_empty ${name}
            sib_dir = set "${parent_dir}/${name}"
            if is_directory ${sib_dir}
                if ${use_wsl}
                    sib_wsl = exec wsl wslpath -u ${sib_dir}
                    sib_docker = trim ${sib_wsl.stdout}
                else
                    sib_docker = set ${sib_dir}
                end
                mount = set "${sib_docker}:/${name}"
                if is_empty ${sibling_mounts}
                    sibling_mounts = set ${mount}
                else
                    sibling_mounts = set "${sibling_mounts}@${mount}"
                end
            end
        end
    end
    release ${parts}
end

sibling_mounts_arg = set "${sibling_mounts}"
if is_empty ${sibling_mounts_arg}
    sibling_mounts_arg = set "-"
end

if equals ${interactive} "1"
    if ${use_wsl}
        exec --fail-on-error wsl bash ${docker_helper} --interactive ${docker_workspace} ${docker_env_file} ${vol_prefix} ${image} ${sibling_mounts_arg} ${extract_artifacts} ${inner_cmd}
    else
        exec --fail-on-error bash ${docker_helper} --interactive ${docker_workspace} ${env_file} ${vol_prefix} ${image} ${sibling_mounts_arg} ${extract_artifacts} ${inner_cmd}
    end
else
    if ${use_wsl}
        exec --fail-on-error wsl bash ${docker_helper} ${docker_workspace} ${docker_env_file} ${vol_prefix} ${image} ${sibling_mounts_arg} ${extract_artifacts} ${inner_cmd}
    else
        exec --fail-on-error bash ${docker_helper} ${docker_workspace} ${env_file} ${vol_prefix} ${image} ${sibling_mounts_arg} ${extract_artifacts} ${inner_cmd}
    end
end
'''

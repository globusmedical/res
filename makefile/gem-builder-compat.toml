# Which GEM OS releases each gm_mctrl GEM backend is compatible with.
#
# `cargo make gem` reads this table, keyed by the major.minor of the
# gm_mctrl_gem version Cargo resolved, to pick both the builder image and the
# module kit. `gem_os` is a semver requirement: the newest release satisfying
# it is what gets fetched, so entries for superseded backends must be bounded
# above — an unbounded range would hand an old backend a newer kernel ABI.

[[builder]]
gm_mctrl_gem="0.20"
image="ghcr.io/globusmedical/gem-builder:1.1.1"
gem_os=">=0.28.4 <0.35.0"
kernel="6.12.74+deb13+1-rt-amd64"

[[builder]]
gm_mctrl_gem="0.22"
image="ghcr.io/globusmedical/gem-builder:1.3.0"
gem_os=">=0.35.0"
kernel="6.12.74+deb13+1-rt-amd64"
